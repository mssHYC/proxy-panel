services:
  proxy-panel:
    build: .
    image: proxy-panel:local
    container_name: proxy-panel
    restart: unless-stopped
    # 容器内 config.yaml 需显式设置 server.listen: "0.0.0.0"。
    # 宿主机仅本地发布面板端口，通过 SSH 隧道或独立 HTTPS 反代访问。
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # 若将 Xray/Sing-box 作为独立容器或宿主机服务，此处保留 kernel 目录共享
      - ./kernel:/app/kernel
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "/app/proxy-panel", "-h"]
      interval: 60s
      timeout: 5s
      retries: 3
