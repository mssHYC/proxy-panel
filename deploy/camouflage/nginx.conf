# Xray terminates TLS on 443 and forwards unauthenticated HTTP here.
# Keep this listener on loopback. Do not proxy to the panel or a core API.
server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    root /var/www/proxy-panel-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
